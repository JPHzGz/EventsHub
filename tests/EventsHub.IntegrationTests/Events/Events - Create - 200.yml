info:
  name: Events - Create - 200
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/events"
  body:
    type: json
    data: |-
      {
        "id": "{{$guid}}",
        "title": "{{$randomCatchPhrase}}",
        "date": "{{$randomDateFuture}}",
        "description": "{{$randomLoremParagraph}}",
        "category": "music",
        "isCancelled": false,
        "city": "{{$randomCity}}",
        "venue": "{{$randomStreetName}}",
        "latitude": "21.0997",
        "longitude": "-86.7561"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
