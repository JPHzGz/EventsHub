info:
  name: Events - Get - 404
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/events/:eventid"
  params:
    - name: eventid
      value: non-existing-id
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("Response returns array", function() {
          const body = res.getBody();
          expect(body).to.equal("The event was not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
